<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta (overridden by React Helmet equivalent via script tags) -->
    <title>Aurelia Hotel — Cliff Resort in Varkala, Kerala</title>
    <meta name="description" content="A boutique cliff-top resort in Varkala, Kerala. Ocean-view rooms, farm-to-table dining and sunset terraces perched above the Arabian Sea." />

    <!-- Demo: noindex injected dynamically in App.jsx via demoMode flag -->

    <!-- Open Graph (static fallback — React updates these) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurelia Hotel — Cliff Resort in Varkala, Kerala" />
    <meta property="og:description" content="A boutique cliff-top resort in Varkala, Kerala." />
    <meta property="og:image" content="/frames/poster.webp" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
